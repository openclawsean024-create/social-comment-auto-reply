<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社群留言自動回覆系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #2563EB;
      --primary-hover: #1d4ed8;
      --accent: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --bg: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --radius: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .container { max-width: 860px; margin: 0 auto; padding: 20px; }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0 32px;
    }
    .logo { font-size: 1.25rem; font-weight: 700; }
    .theme-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.875rem; transition: all 0.2s;
    }
    .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Wizard Steps */
    .wizard-steps {
      display: flex; justify-content: center; gap: 12px; margin-bottom: 32px;
    }
    .step-indicator {
      display: flex; align-items: center; gap: 8px;
    }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.875rem; font-weight: 600;
      border: 2px solid var(--border); background: var(--surface);
      transition: all 0.3s; position: relative;
    }
    .step-circle.active { border-color: var(--primary); color: var(--primary); }
    .step-circle.completed { border-color: var(--accent); background: var(--accent); color: #fff; }
    .step-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .step-connector { width: 40px; height: 2px; background: var(--border); margin-top: 18px; }
    .step-connector.done { background: var(--accent); }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow); margin-bottom: 16px;
      animation: fadeSlideIn 0.3s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }

    /* Form Elements */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-family: var(--font); font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
    }
    .form-textarea { resize: vertical; min-height: 100px; }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 4px; }
    .char-count.warn { color: var(--warning); }
    .char-count.danger { color: var(--danger); }

    /* Chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .chip {
      padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;
      font-family: var(--mono); cursor: pointer; transition: all 0.2s;
      background: rgba(37,99,235,0.1); color: var(--primary);
      border: 1px solid rgba(37,99,235,0.3);
    }
    .chip:hover { background: rgba(37,99,235,0.2); }

    /* Delay selector */
    .delay-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .delay-option {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer;
      font-size: 0.875rem; transition: all 0.2s;
    }
    .delay-option.selected { border-color: var(--primary); background: rgba(37,99,235,0.1); color: var(--primary); }

    /* Advanced panel */
    .advanced-toggle {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      color: var(--muted); font-size: 0.875rem; margin: 16px 0;
      user-select: none;
    }
    .advanced-toggle .chevron { transition: transform 0.3s; font-size: 0.75rem; }
    .advanced-toggle.open .chevron { transform: rotate(180deg); }
    .advanced-panel { display: none; }
    .advanced-panel.open { display: block; }

    /* Reply pool */
    .pool-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .pool-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    }
    .pool-item span { flex: 1; font-size: 0.9rem; }
    .pool-item .remove-btn {
      background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 2px 6px;
    }
    .pool-mode { display: flex; gap: 8px; margin-bottom: 12px; }
    .pool-mode button {
      flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
    }
    .pool-mode button.selected { border-color: var(--primary); color: var(--primary); background: rgba(37,99,235,0.1); }

    /* Keyword rules */
    .keyword-rules { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .keyword-rule {
      display: flex; gap: 8px; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    }
    .keyword-rule .kw-input { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--font); font-size: 0.875rem; outline: none; }
    .keyword-rule .arrow { color: var(--muted); font-size: 0.8rem; }
    .keyword-rule .reply-input { flex: 2; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--font); font-size: 0.875rem; outline: none; }
    .keyword-rule .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 2px 6px; }

    /* Exclude names */
    .exclude-input { display: flex; gap: 8px; }
    .exclude-input input { flex: 1; }

    /* Prefix/Suffix */
    .prefix-suffix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Buttons */
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      cursor: pointer; font-family: var(--font); font-size: 0.95rem; font-weight: 500;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 14px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Step nav buttons */
    .step-nav { display: flex; justify-content: space-between; margin-top: 24px; }

    /* Summary grid */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .summary-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .summary-item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    .summary-item .value { font-size: 0.95rem; font-weight: 500; }

    /* Import/Export */
    .io-buttons { display: flex; gap: 8px; margin-bottom: 16px; }

    /* Monitoring */
    #monitoring-view { display: none; }
    .monitor-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .breathing-lamp {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); animation: breathe 2s ease-in-out infinite;
      box-shadow: 0 0 8px var(--accent);
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .monitor-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; text-align: center;
    }
    .stat-card .stat-num { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-card .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

    /* History timeline */
    .history-timeline { max-height: 500px; overflow-y: auto; }
    .history-item {
      display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
      animation: fadeSlideIn 0.3s ease;
    }
    .history-item:last-child { border-bottom: none; }
    .history-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; flex-shrink: 0;
    }
    .history-body { flex: 1; }
    .history-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .history-comment { font-size: 0.875rem; color: var(--muted); margin-bottom: 4px; }
    .history-reply { font-size: 0.875rem; color: var(--accent); margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--accent); }
    .history-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-left: 6px;
    }
    .badge-keyword { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-pool { background: rgba(37,99,235,0.15); color: var(--primary); }
    .badge-template { background: rgba(16,185,129,0.15); color: var(--accent); }
    .badge-excluded { background: rgba(148,163,184,0.15); color: var(--muted); }
    .badge-default { background: rgba(100,116,139,0.15); color: var(--muted); }

    /* Toast */
    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 16px; box-shadow: var(--shadow); font-size: 0.9rem;
      border-left: 4px solid var(--primary); min-width: 240px; animation: fadeSlideIn 0.3s ease;
    }
    .toast.success { border-left-color: var(--accent); }
    .toast.error { border-left-color: var(--danger); }
    .toast.info { border-left-color: var(--primary); }

    /* Hidden file input */
    input[type="file"] { display: none; }

    /* Mobile */
    @media (max-width: 600px) {
      .summary-grid { grid-template-columns: 1fr; }
      .monitor-stats { grid-template-columns: repeat(3, 1fr); }
      .wizard-steps { gap: 6px; }
      .step-connector { width: 20px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="logo">💬 社群留言自動回覆系統</div>
    <button class="theme-btn" id="theme-toggle">🌙 深色主題</button>
  </header>

  <!-- Setup Wizard -->
  <div id="setup-view">
    <!-- Step indicators -->
    <div class="wizard-steps">
      <div class="step-indicator">
        <div class="step-circle active" id="step1-circle">1</div>
        <span class="step-label">貼文設定</span>
      </div>
      <div class="step-connector" id="conn1-2"></div>
      <div class="step-indicator">
        <div class="step-circle" id="step2-circle">2</div>
        <span class="step-label">回覆設定</span>
      </div>
      <div class="step-connector" id="conn2-3"></div>
      <div class="step-indicator">
        <div class="step-circle" id="step3-circle">3</div>
        <span class="step-label">確認啟動</span>
      </div>
    </div>

    <!-- Step 1: Post Setup -->
    <div id="step1" class="card">
      <div class="card-title">Step 1：貼文設定</div>
      <div class="form-group">
        <label class="form-label">貼文內容</label>
        <textarea class="form-textarea" id="post-content" placeholder="輸入你要監控的社群貼文內容..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">平台</label>
        <select class="form-select" id="platform">
          <option value="facebook">Facebook</option>
          <option value="instagram">Instagram</option>
          <option value="twitter">Twitter/X</option>
          <option value="threads">Threads</option>
          <option value="generic">一般網站</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">貼文連結（選填）</label>
        <input type="url" class="form-input" id="post-url" placeholder="https://..." />
      </div>
      <div class="step-nav">
        <div></div>
        <button class="btn btn-primary" onclick="goStep(2)">下一步 →</button>
      </div>
    </div>

    <!-- Step 2: Reply Configuration -->
    <div id="step2" class="card" style="display:none">
      <div class="card-title">Step 2：回覆設定</div>
      <div class="form-group">
        <label class="form-label">回覆模板</label>
        <textarea class="form-textarea" id="reply-template" placeholder="感謝留言！我會儘快回覆你 😊"></textarea>
        <div class="char-count" id="template-char-count">0 / 無限制</div>
        <div class="chips">
          <span class="chip" onclick="insertVar('{{ commenter_name }}')">{{ commenter_name }}</span>
          <span class="chip" onclick="insertVar('{{ post_preview }}')">{{ post_preview }}</span>
          <span class="chip" onclick="insertVar('{{ date }}')">{{ date }}</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">回覆延遲</label>
        <div class="delay-options">
          <button class="delay-option selected" data-delay="0">立即</button>
          <button class="delay-option" data-delay="60">1 分鐘</button>
          <button class="delay-option" data-delay="300">5 分鐘</button>
          <button class="delay-option" data-delay="random">隨機 1-10 分鐘</button>
        </div>
      </div>

      <!-- Advanced toggle -->
      <div class="advanced-toggle" id="advanced-toggle" onclick="toggleAdvanced()">
        <span class="chevron">▼</span> 進階設定
      </div>
      <div class="advanced-panel" id="advanced-panel">

        <!-- Reply Pool -->
        <div class="form-group">
          <label class="form-label">回覆池（多組回覆）</label>
          <div class="pool-list" id="pool-list"></div>
          <div style="display:flex;gap:8px">
            <input type="text" class="form-input" id="pool-input" placeholder="新增回覆到池中..." onkeydown="if(event.key==='Enter')addPoolItem()" />
            <button class="btn btn-secondary btn-sm" onclick="addPoolItem()">新增</button>
          </div>
          <div class="pool-mode" style="margin-top:8px">
            <button class="selected" id="pool-random" onclick="setPoolMode('random')">🎲 隨機</button>
            <button id="pool-rr" onclick="setPoolMode('roundrobin')">🔄 輪流</button>
          </div>
        </div>

        <!-- Keyword Rules -->
        <div class="form-group">
          <label class="form-label">關鍵字規則</label>
          <div class="keyword-rules" id="keyword-rules"></div>
          <button class="btn btn-secondary btn-sm" onclick="addKeywordRule()">+ 新增規則</button>
        </div>

        <!-- Exclude names -->
        <div class="form-group">
          <label class="form-label">排除名單（逗號分隔）</label>
          <div class="exclude-input">
            <input type="text" class="form-input" id="exclude-names" placeholder="王小明, 系統管理員" />
          </div>
        </div>

        <!-- Prefix / Suffix -->
        <div class="form-group">
          <label class="form-label">回覆前綴 / 後綴</label>
          <div class="prefix-suffix">
            <input type="text" class="form-input" id="reply-prefix" placeholder="前綴（可空白）" />
            <input type="text" class="form-input" id="reply-suffix" placeholder="後綴（可空白）" />
          </div>
        </div>
      </div>

      <div class="step-nav">
        <button class="btn btn-secondary" onclick="goStep(1)">← 上一步</button>
        <button class="btn btn-primary" onclick="goStep(3)">下一步 →</button>
      </div>
    </div>

    <!-- Step 3: Summary & Launch -->
    <div id="step3" class="card" style="display:none">
      <div class="card-title">Step 3：確認啟動</div>
      <div class="io-buttons">
        <button class="btn btn-secondary btn-sm" onclick="exportConfig()">📥 匯出設定</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-file').click()">📤 匯入設定</button>
        <input type="file" id="import-file" accept=".json" onchange="importConfig(event)" />
      </div>
      <div class="summary-grid" id="summary-grid">
        <div class="summary-item">
          <div class="label">平台</div>
          <div class="value" id="sum-platform">-</div>
        </div>
        <div class="summary-item">
          <div class="label">回覆延遲</div>
          <div class="value" id="sum-delay">-</div>
        </div>
        <div class="summary-item" style="grid-column: 1/-1">
          <div class="label">回覆模板</div>
          <div class="value" id="sum-template">-</div>
        </div>
        <div class="summary-item" id="sum-pool-item" style="display:none">
          <div class="label">回覆池</div>
          <div class="value" id="sum-pool">-</div>
        </div>
        <div class="summary-item" id="sum-kw-item" style="display:none">
          <div class="label">關鍵字規則</div>
          <div class="value" id="sum-kw">-</div>
        </div>
      </div>
      <div class="step-nav">
        <button class="btn btn-secondary" onclick="goStep(2)">← 上一步</button>
        <button class="btn btn-accent" onclick="startMonitoring()">🚀 開始監控</button>
      </div>
    </div>
  </div>

  <!-- Monitoring View -->
  <div id="monitoring-view">
    <div class="monitor-header">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="breathing-lamp"></div>
        <span style="font-weight:600;font-size:1.1rem">監控中</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="simulateComment()">🧪 測試留言</button>
        <button class="btn btn-secondary btn-sm" onclick="clearHistory()">🗑 清除紀錄</button>
        <button class="btn btn-secondary btn-sm" onclick="stopMonitoring()">⏹ 停止監控</button>
      </div>
    </div>
    <div class="monitor-stats">
      <div class="stat-card">
        <div class="stat-num" id="stat-received">0</div>
        <div class="stat-label">收到留言</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-replied">0</div>
        <div class="stat-label">已回覆</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">待回覆</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">回覆歷史</div>
      <div class="history-timeline" id="history-timeline">
        <div style="text-align:center;color:var(--muted);padding:40px 0;font-size:0.9rem">
          尚無回覆紀錄，點擊「測試留言」開始
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
const STORAGE_KEY = 'scar_config';
let state = {
  postContent: '',
  platform: 'facebook',
  postUrl: '',
  replyTemplate: '',
  delay: 0,
  pool: [],
  poolMode: 'random',
  poolIndex: 0,
  keywords: [],
  excludeNames: [],
  prefix: '',
  suffix: '',
  history: [],
  monitoring: false,
  theme: 'dark',
};

let pendingReplies = [];

// ── Init ──────────────────────────────────────────────────────────
function init() {
  loadState();
  applyTheme();
  setupEventListeners();
  restoreUI();
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function restoreUI() {
  document.getElementById('post-content').value = state.postContent;
  document.getElementById('platform').value = state.platform;
  document.getElementById('post-url').value = state.postUrl;
  document.getElementById('reply-template').value = state.replyTemplate;
  document.getElementById('exclude-names').value = state.excludeNames.join(', ');
  document.getElementById('reply-prefix').value = state.prefix || '';
  document.getElementById('reply-suffix').value = state.suffix || '';
  updateTemplateCharCount();
  renderPool();
  renderKeywordRules();
  document.querySelectorAll('.delay-option').forEach(btn => {
    btn.classList.toggle('selected', parseInt(btn.dataset.delay) === state.delay || btn.dataset.delay === String(state.delay));
  });
  document.getElementById('pool-random').classList.toggle('selected', state.poolMode === 'random');
  document.getElementById('pool-rr').classList.toggle('selected', state.poolMode === 'roundrobin');
}

// ── Theme ─────────────────────────────────────────────────────────
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-toggle').textContent =
    state.theme === 'dark' ? '☀️ 淺色主題' : '🌙 深色主題';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveState();
});

// ── Wizard Navigation ─────────────────────────────────────────────
function goStep(n) {
  // Validate current step
  if (n > 1 && !validateStep(currentStep())) {
    return;
  }

  ['step1','step2','step3'].forEach((id, i) => {
    document.getElementById(id).style.display = (i+1) === n ? 'block' : 'none';
  });

  const circles = [
    document.getElementById('step1-circle'),
    document.getElementById('step2-circle'),
    document.getElementById('step3-circle'),
  ];
  const conns = [
    document.getElementById('conn1-2'),
    document.getElementById('conn2-3'),
  ];

  circles.forEach((c, i) => {
    c.classList.remove('active','completed');
    if (i+1 < n) c.classList.add('completed'), c.textContent = '✓';
    else if (i+1 === n) c.classList.add('active'), c.textContent = i+1;
    else c.textContent = i+1;
  });
  if (conns[0]) conns[0].classList.toggle('done', n > 1);
  if (conns[1]) conns[1].classList.toggle('done', n > 2);

  if (n === 3) updateSummary();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function currentStep() {
  for (let i = 1; i <= 3; i++) {
    if (document.getElementById(`step${i}`).style.display !== 'none') return i;
  }
  return 1;
}

function validateStep(step) {
  if (step === 1) {
    const content = document.getElementById('post-content').value.trim();
    if (!content) { showToast('請填寫貼文內容', 'error'); return false; }
    state.postContent = content;
    state.platform = document.getElementById('platform').value;
    state.postUrl = document.getElementById('post-url').value.trim();
  } else if (step === 2) {
    state.replyTemplate = document.getElementById('reply-template').value;
    state.excludeNames = document.getElementById('exclude-names').value.split(',').map(s => s.trim()).filter(Boolean);
    state.prefix = document.getElementById('reply-prefix').value.trim();
    state.suffix = document.getElementById('reply-suffix').value.trim();
  }
  saveState();
  return true;
}

// ── Reply Template Char Count ─────────────────────────────────────
function updateTemplateCharCount() {
  const el = document.getElementById('template-char-count');
  const val = document.getElementById('reply-template').value;
  const len = val.length;
  el.textContent = `${len} 字`;
  el.className = 'char-count' + (len >= 400 ? ' danger' : len >= 300 ? ' warn' : '');
}

function insertVar(v) {
  const ta = document.getElementById('reply-template');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const text = ta.value;
  ta.value = text.slice(0, start) + v + text.slice(end);
  ta.selectionStart = ta.selectionEnd = start + v.length;
  ta.focus();
  updateTemplateCharCount();
}

// ── Delay Options ─────────────────────────────────────────────────
document.querySelectorAll('.delay-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.delay-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.delay = btn.dataset.delay;
    saveState();
  });
});

// ── Advanced Panel ────────────────────────────────────────────────
function toggleAdvanced() {
  const toggle = document.getElementById('advanced-toggle');
  const panel = document.getElementById('advanced-panel');
  const open = panel.classList.toggle('open');
  toggle.classList.toggle('open', open);
}

// ── Reply Pool ────────────────────────────────────────────────────
function addPoolItem() {
  const input = document.getElementById('pool-input');
  const val = input.value.trim();
  if (!val) return;
  state.pool.push(val);
  input.value = '';
  renderPool();
  saveState();
}

function removePoolItem(i) {
  state.pool.splice(i, 1);
  renderPool();
  saveState();
}

function renderPool() {
  const list = document.getElementById('pool-list');
  list.innerHTML = state.pool.map((item, i) => `
    <div class="pool-item">
      <span>${escHtml(item)}</span>
      <button class="remove-btn" onclick="removePoolItem(${i})">✕</button>
    </div>
  `).join('');
}

function setPoolMode(mode) {
  state.poolMode = mode;
  document.getElementById('pool-random').classList.toggle('selected', mode === 'random');
  document.getElementById('pool-rr').classList.toggle('selected', mode === 'roundrobin');
  saveState();
}

// ── Keyword Rules ─────────────────────────────────────────────────
function addKeywordRule() {
  state.keywords.push({ keyword: '', reply: '' });
  renderKeywordRules();
}

function removeKeywordRule(i) {
  state.keywords.splice(i, 1);
  renderKeywordRules();
  saveState();
}

function renderKeywordRules() {
  const container = document.getElementById('keyword-rules');
  container.innerHTML = state.keywords.map((rule, i) => `
    <div class="keyword-rule">
      <input type="text" class="kw-input" placeholder="關鍵字" value="${escAttr(rule.keyword)}"
        onchange="state.keywords[${i}].keyword=this.value;saveState()" />
      <span class="arrow">→</span>
      <input type="text" class="reply-input" placeholder="回覆內容" value="${escAttr(rule.reply)}"
        onchange="state.keywords[${i}].reply=this.value;saveState()" />
      <button class="remove-btn" onclick="removeKeywordRule(${i})">✕</button>
    </div>
  `).join('');
}

// ── Summary ───────────────────────────────────────────────────────
function updateSummary() {
  document.getElementById('sum-platform').textContent = {
    facebook:'Facebook', instagram:'Instagram', twitter:'Twitter/X',
    threads:'Threads', generic:'一般網站'
  }[state.platform] || state.platform;

  const delayMap = { '0':'立即', '60':'1 分鐘', '300':'5 分鐘', 'random':'隨機 1-10 分鐘' };
  document.getElementById('sum-delay').textContent = delayMap[String(state.delay)] || String(state.delay);

  const tmpl = state.replyTemplate || '（未設定）';
  document.getElementById('sum-template').textContent = tmpl.length > 100 ? tmpl.slice(0,100)+'...' : tmpl;

  const poolItem = document.getElementById('sum-pool-item');
  const kwItem = document.getElementById('sum-kw-item');
  if (state.pool.length) {
    poolItem.style.display = 'block';
    document.getElementById('sum-pool').textContent = `${state.pool.length} 則（${state.poolMode === 'random' ? '隨機' : '輪流'}）`;
  } else { poolItem.style.display = 'none'; }

  if (state.keywords.length && state.keywords.some(k => k.keyword)) {
    kwItem.style.display = 'block';
    document.getElementById('sum-kw').textContent = state.keywords.filter(k => k.keyword).map(k => `"${k.keyword}"`).join(', ');
  } else { kwItem.style.display = 'none'; }
}

// ── Import / Export ────────────────────────────────────────────────
function exportConfig() {
  const config = {
    postContent: state.postContent,
    platform: state.platform,
    postUrl: state.postUrl,
    replyTemplate: state.replyTemplate,
    delay: state.delay,
    pool: state.pool,
    poolMode: state.poolMode,
    keywords: state.keywords,
    excludeNames: state.excludeNames,
    prefix: state.prefix,
    suffix: state.suffix,
  };
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scar-config.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('設定已匯出', 'success');
}

function importConfig(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const config = JSON.parse(e.target.result);
      Object.assign(state, config);
      saveState();
      restoreUI();
      showToast('設定已匯入', 'success');
    } catch(err) {
      showToast('匯入失敗：檔案格式錯誤', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Monitoring ────────────────────────────────────────────────────
function startMonitoring() {
  state.monitoring = true;
  state.history = [];
  pendingReplies = [];
  saveState();
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('monitoring-view').style.display = 'block';
  updateStats();
  showToast('監控已啟動', 'success');
}

function stopMonitoring() {
  state.monitoring = false;
  saveState();
  document.getElementById('monitoring-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  goStep(3);
  showToast('監控已停止', 'info');
}

function clearHistory() {
  state.history = [];
  pendingReplies = [];
  saveState();
  renderHistory();
  updateStats();
  showToast('紀錄已清除', 'info');
}

// ── Fake Data ─────────────────────────────────────────────────────
const FAKE_NAMES = ['王小明','陳美玲','林志偉','黃小娟','李宗翰','張雅琪','劉建志','許曉彤','曾怡君','鄭偉成','周雅筑','吳俊傑','徐雅惠','孫志明','馬怡君','朱文傑','胡雅琪','林佳蓉','黃建志','楊雅惠'];
const FAKE_COMMENTS = [
  '請問這多少錢？','有現貨嗎？','可以寄海外嗎？','有優惠嗎？','什麼時候到貨？',
  '看起來很棒！','請問有其他顏色嗎？','運費怎麼算？','可以退貨嗎？','太貴了吧～',
  '終於補貨了！','馬上來買','已下單，等發貨','謝謝分享～','太實用了！',
  '請問有S號嗎？','尺寸正常嗎？','收到後很不錯！','質感很好！','推薦購買！',
];

function simulateComment() {
  const name = FAKE_NAMES[Math.floor(Math.random() * FAKE_NAMES.length)];
  const comment = FAKE_COMMENTS[Math.floor(Math.random() * FAKE_COMMENTS.length)];
  processComment(name, comment);
}

function processComment(name, comment) {
  const isExcluded = state.excludeNames.some(n => name.includes(n));
  let replyText = '';
  let replyType = '';

  if (isExcluded) {
    replyType = 'excluded';
  } else {
    // Keyword rule priority
    const matchedKw = state.keywords.find(k => k.keyword && comment.includes(k.keyword));
    if (matchedKw) {
      replyText = matchedKw.reply;
      replyType = 'keyword';
    } else if (state.pool.length) {
      if (state.poolMode === 'random') {
        replyText = state.pool[Math.floor(Math.random() * state.pool.length)];
      } else {
        replyText = state.pool[state.poolIndex % state.pool.length];
        state.poolIndex++;
      }
      replyType = 'pool';
    } else if (state.replyTemplate) {
      replyText = state.replyTemplate;
      replyType = 'template';
    } else {
      replyText = '感謝留言！我會儘快回覆你 😊';
      replyType = 'default';
    }
  }

  // Variable substitution
  replyText = replyText
    .replace(/\{\{\s*commenter_name\s*\}\}/g, name)
    .replace(/\{\{\s*post_preview\s*\}\}/g, (state.postContent || '').slice(0, 50))
    .replace(/\{\{\s*date\s*\}\}/g, new Date().toLocaleDateString('zh-TW'));

  if (state.prefix) replyText = state.prefix + replyText;
  if (state.suffix) replyText = replyText + state.suffix;

  const entry = {
    id: Date.now(),
    name,
    comment,
    reply: isExcluded ? '(已排除，未回覆)' : replyText,
    replyType,
    timestamp: new Date().toISOString(),
  };

  state.history.unshift(entry);
  if (state.history.length > 50) state.history.pop();
  saveState();
  renderHistory();
  updateStats();

  if (!isExcluded) {
    const delay = state.delay === 'random'
      ? Math.floor(Math.random() * 600 + 60) * 1000
      : parseInt(state.delay) * 1000;
    setTimeout(() => {
      const badge = document.querySelector(`[data-id="${entry.id}"] .history-badge`);
      if (badge) badge.textContent = '已回覆';
    }, Math.max(delay, 500));
  }
}

// ── Render History ────────────────────────────────────────────────
function renderHistory() {
  const container = document.getElementById('history-timeline');
  if (!state.history.length) {
    container.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:0.9rem">尚無回覆紀錄，點擊「測試留言」開始</div>`;
    return;
  }
  container.innerHTML = state.history.map(entry => {
    const initials = entry.name.slice(0, 1);
    const badgeMap = {
      keyword: { cls: 'badge-keyword', text: '關鍵字' },
      pool: { cls: 'badge-pool', text: '回覆池' },
      template: { cls: 'badge-template', text: '模板' },
      excluded: { cls: 'badge-excluded', text: '已排除' },
      default: { cls: 'badge-default', text: '預設' },
    };
    const badge = badgeMap[entry.replyType] || badgeMap.default;
    const isPending = entry.replyType !== 'excluded' && entry.reply !== '(已排除，未回覆)';
    return `
      <div class="history-item" data-id="${entry.id}">
        <div class="history-avatar">${initials}</div>
        <div class="history-body">
          <div class="history-name">${escHtml(entry.name)} <span class="history-badge ${badge.cls}">${isPending ? '待回覆' : badge.text}</span></div>
          <div class="history-comment">${escHtml(entry.comment)}</div>
          ${entry.replyType !== 'excluded' ? `<div class="history-reply">→ ${escHtml(entry.reply)}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function updateStats() {
  const total = state.history.length;
  const excluded = state.history.filter(e => e.replyType === 'excluded').length;
  const replied = state.history.filter(e => e.replyType !== 'excluded').length;
  document.getElementById('stat-received').textContent = total;
  document.getElementById('stat-replied').textContent = replied;
  document.getElementById('stat-pending').textContent = 0;
}

// ── Toast ────────────────────────────────────────────────────────
function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ── Event Listeners ───────────────────────────────────────────────
function setupEventListeners() {
  document.getElementById('reply-template').addEventListener('input', () => {
    state.replyTemplate = document.getElementById('reply-template').value;
    updateTemplateCharCount();
    saveState();
  });
}

// ── Utilities ────────────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str).replace(/"/g,'&quot;');
}

// ── Boot ─────────────────────────────────────────────────────────
init();
</script>
